[workspace]
resolver = "3"
members = ["crates/jungle-core", "crates/jungle-entrant", "crates/jungle-fixture", "crates/jungle-web"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
miniz_oxide = "=0.9.1"
wit-bindgen = "=0.63.0"
wasm-bindgen = "=0.2.130"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
